<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Cámara SEPESA" />
    <meta name="description" content="Cámara SEPESA. La foto se queda en el teléfono, con el logo y la hora de Caracas." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Cámara SEPESA</title>
  </head>
  <body>
    <section id="gate" class="screen gate">
      <img class="gate-logo" src="/brand/sepesa-logo-white.png" alt="SEPESA" />
      <button id="open" class="shutter" type="button" aria-label="Abrir cámara"></button>
      <p class="hint">Usa la cámara de este teléfono. La foto y el video se quedan aquí.</p>
      <p id="gate-error" class="error" hidden></p>
    </section>

    <section id="view" class="screen" hidden>
      <video id="preview" class="preview" playsinline autoplay muted></video>
      <div class="topbar">
        <button id="torch" class="icon-btn" type="button" aria-label="Linterna" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M9 2h6l1 4H8L9 2zm-1 6h8l1 3v11a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V11l1-3zm3 5h2v4h-2v-4z" />
          </svg>
        </button>
        <button id="flip" class="icon-btn" type="button" aria-label="Cambiar cámara">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8a8 8 0 0 1 13.5-3.5M20 4v4h-4M20 16a8 8 0 0 1-13.5 3.5M4 20v-4h4" />
          </svg>
        </button>
      </div>
      <div id="rec" class="rec" hidden>
        <span class="rec-dot"></span>
        <span id="elapsed">0:00</span>
      </div>
      <p id="view-error" class="view-error" hidden></p>
      <div class="dock">
        <div class="modes" role="group" aria-label="Modo">
          <button id="mode-photo" class="mode" type="button" aria-pressed="true">Foto</button>
          <button id="mode-video" class="mode" type="button" aria-pressed="false">Video</button>
        </div>
        <button id="shutter" class="shutter" type="button" aria-label="Tomar foto"></button>
      </div>
    </section>

    <section id="review" class="screen" hidden>
      <img id="review-img" class="review-still" alt="Foto con sello SEPESA" />
      <video id="review-video" class="review-video" playsinline controls hidden></video>
      <p id="review-note" class="review-note" hidden></p>
      <div class="review-bar">
        <button id="retake" class="action" type="button">Repetir</button>
        <button id="download" class="action" type="button">Descargar</button>
        <button id="share" class="action action-primary" type="button">Compartir</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
